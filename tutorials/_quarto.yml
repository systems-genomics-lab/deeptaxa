project:
  type: website
  output-dir: _site

website:
  title: "DeepTaxa Tutorials"
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: Prediction
        href: prediction.qmd
      - text: Validation
        href: validation.qmd
      - text: Case study
        href: casestudy.qmd
      - text: Training
        href: training.qmd
      - text: Analysis
        href: analysis.qmd
      - text: Architecture
        href: architecture.qmd
      - text: QIIME 2
        href: qiime2.qmd
    right:
      - icon: github
        href: https://github.com/systems-genomics-lab/deeptaxa
  page-footer:
    center: "[DeepTaxa](https://github.com/systems-genomics-lab/deeptaxa) — Systems Genomics Lab"

format:
  html:
    theme: [lumen, custom.scss]
    toc: true
    toc-depth: 3
    toc-title: "Contents"
    code-fold: false
    code-tools: false
    number-sections: true
    link-external-newwindow: true
    link-external-icon: true
    smooth-scroll: true
    fig-cap-location: bottom
    tbl-cap-location: top

bibliography: references.bib
csl: apa.csl

execute:
  freeze: auto
  echo: true

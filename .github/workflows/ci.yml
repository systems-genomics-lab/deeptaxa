name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests (pure Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pandas
        run: pip install pandas
      - name: Run pure-Python tests
        run: |
          python -m unittest \
            q2_deeptaxa.tests.test_taxonomy \
            q2_deeptaxa.tests.test_checkpoint -v

  core:
    name: Core tests (CPU torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm needs tags/history for the version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the CPU torch wheel
        # The default wheel is a large CUDA build the runner cannot use, so pull
        # the CPU index first and let the package install below reuse it.
        run: pip install "torch>=2.4" --index-url https://download.pytorch.org/whl/cpu
      - name: Install DeepTaxa
        run: pip install .
      - name: Run the core deeptaxa tests
        run: |
          python -m unittest \
            tests.test_dataset \
            tests.test_gradient_accumulation \
            tests.test_predict_agreement \
            tests.test_pooling_mask \
            tests.test_save_best_only \
            tests.test_train_predict_smoke -v

  qiime2:
    name: QIIME 2 plugin tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm needs tags/history for the version
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
      - name: Create the QIIME 2 environment
        run: |
          wget -q -O env.yml \
            https://data.qiime2.org/distro/amplicon/qiime2-amplicon-2024.10-py310-linux-conda.yml
          conda env create -n qiime2 --file env.yml
      - name: Install DeepTaxa and the plugin
        run: |
          conda run -n qiime2 pip install --no-deps .
          # CPU torch wheel: the runner has no GPU, so a conda solve picks a CUDA
          # build that cannot be satisfied. transformers is pinned below 5 because
          # newer versions pull a click that q2cli in 2024.10 cannot use.
          conda run -n qiime2 pip install "torch>=2.4" \
            --index-url https://download.pytorch.org/whl/cpu
          conda run -n qiime2 pip install "transformers>=4.28,<5" \
            biopython h5py optuna tqdm
          conda run -n qiime2 qiime dev refresh-cache
      - name: Check the plugin is registered
        run: conda run -n qiime2 qiime deeptaxa --help
      - name: Run the plugin test suite
        run: |
          conda run -n qiime2 python -m unittest discover \
            -s q2_deeptaxa/tests -p "test_*.py" -v
